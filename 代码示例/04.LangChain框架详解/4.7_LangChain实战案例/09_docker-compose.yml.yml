version: '3.8'

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LLM_MODEL=${LLM_MODEL:-gpt-5.4-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - PERSIST_DIRECTORY=/app/storage/chroma
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=100
      - TOP_K=5
      - DEBUG=false
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    restart: unless-stopped

  # 可选：使用 OpenAI 兼容的代理服务
  # openai-proxy:
  #   image: quartznet/openai-proxy:latest
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
